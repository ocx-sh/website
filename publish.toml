# `grim publish` manifest for the @ocx-sh/theme skills (schema:
# `grim schema --kind publish`). They publish into the OCX lore catalog, flat:
# ghcr.io/ocx-sh/lore/<name>, beside the packages ocx-sh/grimoire-lore ships.
#
# NO `version` here, on purpose: the skills version with the npm package. Every
# release tag vX.Y.Z runs `grim publish --version vX.Y.Z` from the repo root
# (the default `version_prefix` "v" strips the v). An entry without a version
# from any source fails the manifest, so a forgotten flag cannot publish.
# Validate locally: `ocx exec -- grim publish --dry-run --version 0.0.0`.
registry = "ghcr.io"
repository_prefix = "ocx-sh/lore"

# Fills only what an artifact leaves unset. `license` stays in each SKILL.md.
[metadata]
authors = "The OCX Authors"
vendor = "OCX"
repository = "https://github.com/ocx-sh/website"

[support]
issues = "https://github.com/ocx-sh/website/issues"
security = "https://github.com/ocx-sh/website/security"

# One companion for every entry: the package readme describes the framework
# each skill teaches.
[description]
readme = "packages/theme/README.md"
logo = "packages/theme/src/logo.svg"

# `--announce` opens its PR here. Never drop this table: without it grim falls
# back to the public first-party index.
[announce]
repository = "https://github.com/ocx-sh/grimoire-lore"
namespace = "ocx-sh"

# Conventional paths: skills/<name>/, bundles/<name>.toml. Bundles publish last.
[skills.ocx-theme-setup]
[skills.ocx-theme-components]
[skills.ocx-theme-theming]
[skills.ocx-theme-icons]
[skills.ocx-theme-deploy]
[skills.ocx-theme-quality]

[bundles.ocx-theme]
