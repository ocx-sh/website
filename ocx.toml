#:schema https://ocx.sh/schemas/project/v1.json
# OCX project toolchain — managed by `ocx add` / `ocx remove`

[tools]
task = "ocx.sh/go-task/task:3.53.1"
node = "ocx.sh/nodejs/node:24.21.0"
pnpm = "ocx.sh/pnpm/pnpm:11.22.0"
oxfmt = "ocx.sh/oxc-project/oxfmt:0.65.0"
oxlint = "ocx.sh/oxc-project/oxlint:1.79.0"

# The deploy-skill template test lints with actionlint and zizmor (via uvx); CI's test job
# installs only default,test, so they live here too instead of being pulled mid-test.
[group.test.tools]
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
uv = "ocx.sh/astral-sh/uv:0.13.0"

[group.docs.tools]
lychee = "ocx.sh/lychee/lychee:0.24.2"

[group.lint.tools]
prek = "ocx.sh/prek/prek:0.5.5"
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
gitleaks = "ocx.sh/gitleaks/gitleaks:8.30.1"
grim = "ocx.sh/grimoire/cli:0.14.3"
uv = "ocx.sh/astral-sh/uv:0.13.0"

[group.release.tools]
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.2"
