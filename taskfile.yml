# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Run through the ocx toolchain: `ocx exec -- task <name>`.
version: '3'

includes:
  baseline: { taskfile: taskfiles/baseline.taskfile.yml, flatten: true }
  site: { taskfile: taskfiles/site.yml, optional: true }
  deploy: { taskfile: taskfiles/deploy.yml, optional: true }
  lore: { taskfile: taskfiles/lore.yml, optional: true }
  bunny: { taskfile: taskfiles/bunny.yml, optional: true }

vars:
  # Apps present on disk: every examples/* with a package.json, plus site/ once it exists.
  APPS:
    sh: 'for d in examples/*/ site/; do if [ -f "${d}package.json" ]; then echo "${d%/}"; fi; done'
  DISTS:
    sh: 'for d in examples/*/ site/; do if [ -f "${d}package.json" ]; then printf "%sdist " "$d"; fi; done'
  OXC: scripts/bin/oxc.sh

tasks:
  default:
    cmds: [task --list]
    silent: true

  install:
    desc: Install workspace dependencies
    sources: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, '*/*/package.json', site/package.json]
    generates: [node_modules/.modules.yaml]
    cmds: [pnpm install --frozen-lockfile]

  samples:
    desc: Pull real docs from consumer repos and convert them into the preview projects (.tmp/previews, gitignored)
    cmds: ['node scripts/samples/fetch.ts {{.CLI_ARGS}}']

  previews:
    desc: Build every consumer preview site offline from the samples cache (`task previews -- <site>` for one; dist in .tmp/previews/<site>/dist)
    deps: [install]
    cmds: ['node scripts/previews/build.ts {{.CLI_ARGS}}']

  dev:
    desc: Live-reload the Starlight example wearing the theme (http://localhost:4321/docs/)
    aliases: ['theme:dev']
    deps: [install]
    cmds:
      - pnpm --filter @ocx-sh/example-starlight dev

  build:
    desc: astro build every app present on disk (examples/*, site)
    deps: [install]
    cmds:
      - for: { var: APPS }
        cmd: pnpm --dir {{.ITEM}} run build

  sync:
    desc: astro sync every app, so a clean checkout has the generated content types lint and tsc read
    deps: [install]
    cmds:
      - for: { var: APPS }
        cmd: pnpm --dir {{.ITEM}} exec astro sync

  lint:
    desc: oxlint (type-aware), typed ESLint, actionlint
    deps: [sync]
    cmds:
      - '{{.OXC}} oxlint --type-aware'
      - pnpm exec eslint --max-warnings 0 .
      # actionlint + zizmor run in `workflows:lint` (baseline), part of `verify`.

  fmt:
    desc: oxfmt --check (ts/js/json/css/md/yaml), prettier --check for .astro
    deps: [install]
    cmds:
      - '{{.OXC}} oxfmt --check'
      - pnpm exec prettier --check "**/*.astro"

  fmt:fix:
    desc: Apply oxfmt and prettier formatting
    deps: [install]
    cmds:
      - '{{.OXC}} oxfmt'
      - pnpm exec prettier --write "**/*.astro"

  typecheck:
    desc: tsc over the workspace (checkJs), astro check over every app
    deps: [sync]
    cmds:
      - pnpm exec tsc --noEmit
      - for: { var: APPS }
        cmd: pnpm --dir {{.ITEM}} run check

  test:
    desc: Vitest (packages, scripts, infra, deploy action)
    deps: [install]
    cmds: [pnpm exec vitest run]

  theme:test:
    desc: Vitest for packages/theme only
    deps: [install]
    cmds: [pnpm exec vitest run packages/theme]

  css:
    desc: Built-CSS gate (outside-layers, literal-colours, dark-parity, inlined-sheets) over every app dist
    cmds:
      - node scripts/require-dist.mjs {{.DISTS}}
      - node scripts/css/literal-colours.mjs $(find {{.DISTS}} -name '*.css' -o -name '*.html')
      - node scripts/css/outside-layers.mjs $(find {{.DISTS}} -name '*.css' -o -name '*.html')
      - node scripts/css/dark-parity.mjs $(find {{.DISTS}} -name '*.css' -o -name '*.html')
      - node scripts/css/inlined-sheets.mjs {{.DISTS}}

  e2e:
    desc: Playwright over the built dists
    deps: [install]
    cmds:
      - node scripts/require-dist.mjs {{.DISTS}}
      - pnpm exec playwright test {{.CLI_ARGS}}

  lighthouse:
    desc: Lighthouse over the built dists (parallel lanes, retry-on-fail, cache; LH_NO_CACHE=1 for all; -- --only <substr> narrows)
    deps: [install]
    cmds:
      - node scripts/require-dist.mjs {{.DISTS}}
      # Stages the example dist (scripts/lhci-stage.mjs), then audits.
      - node scripts/lighthouse.mjs {{.CLI_ARGS}}

  lighthouse:changed:
    desc: Dev Lighthouse over the pages this branch touches plus / and /docs/ (LH_PRESET=desktop allowed; -- --only <substr>)
    cmds:
      - task: lighthouse
        vars: { CLI_ARGS: '--dev --changed {{.CLI_ARGS}}' }

  visual:
    desc: Mock-vs-site screenshot pairs report (--watch to rerun)
    deps: [install]
    cmds: ['node scripts/visual/visual.mjs {{.CLI_ARGS}}']

  pack:
    desc: Pack smoke test of the published packages (publint, attw)
    deps: [install]
    cmds: [node scripts/pack-smoke.mjs]

  docs:
    desc: markdownlint and offline link check over docs/
    deps: [install]
    cmds:
      - pnpm exec markdownlint-cli2 "docs/**/*.md"
      - ocx exec -g docs -- lychee --offline --no-progress docs/
      # ponytail: validates each docs/lore/ skill dir + top-level rule .md via grim build
      # (validate + pack, no push); adjust the glob if WP9's tree shape differs.
      - cmd: >
          for p in docs/lore/*/; do [ -f "${p}SKILL.md" ] && ocx exec -g lint -- grim build --offline "${p%/}"; done;
          for p in docs/lore/*.md; do [ -f "$p" ] && ocx exec -g lint -- grim build --offline "$p"; done
        if: test -d docs/lore

  release:bump-files:
    desc: Set the @ocx-sh/theme version (the one release.yml verifies against the tag); called by release:prepare with VERSION=x.y.z
    requires: { vars: [VERSION] }
    cmds:
      - pnpm --dir packages/theme version {{.VERSION}} --no-git-tag-version

  cutover:verify:
    desc: Owner-local DNS/CDN cutover verification (alias of bunny:cutover-verify)
    cmds: [task: 'bunny:cutover-verify']

  verify:
    desc: Every gate the basic CI tier runs, locally
    aliases: [check]
    cmds:
      - task: lint
      - task: fmt
      - task: typecheck
      - task: test
      - task: build
      - task: css
      - task: workflows:lint

  playwright:install:
    internal: true
    cmds:
      - pnpm exec playwright install {{if .CI}}--with-deps {{end}}chromium

  ci:lint:
    desc: CI lint tier (lock, baseline, secrets and workflow lint run beside it in verify-basic)
    cmds:
      - task: lint
      - task: fmt

  ci:test:
    desc: CI test tier - typecheck, Vitest (JUnit in target/reports/junit/), built-CSS gate
    cmds:
      - task: typecheck
      - mkdir -p target/reports/junit
      - pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=target/reports/junit/vitest.xml
      - task: build
      - task: css

  ci:build:
    desc: CI build tier (no compiled artifact beyond the site builds ci:test and ci:docs run)
    cmds:
      - 'echo "ci:build: nothing to build"'

  ci:docs:
    desc: CI docs tier - site build plus the Lighthouse gate
    env: { LH_HTML: '1' }
    cmds:
      - task: build
      - task: playwright:install
      - task: lighthouse

  ci:deep:
    desc: CI deep tier - Playwright e2e (JUnit in target/reports/junit/) and the pack smoke test
    cmds:
      - mkdir -p target/reports/junit
      - task: build
      - task: playwright:install
      - node scripts/require-dist.mjs {{.DISTS}}
      - cmd: pnpm exec playwright test --reporter=list,junit
        env: { PLAYWRIGHT_JUNIT_OUTPUT_FILE: target/reports/junit/e2e.xml }
      - task: pack
